name: Test – storage setup
on:
  push:
    branches: [test]
    paths: ['.github/workflows/test-setup.yml']
jobs:
  kv:
    runs-on: ubuntu-latest
    steps:
      - name: Create KV namespace for boat listings
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0d05fe281c7244816fae3908aff78f8f
          command: kv namespace create morgana-boats
      - name: List KV namespaces
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0d05fe281c7244816fae3908aff78f8f
          command: kv namespace list
