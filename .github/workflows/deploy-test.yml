name: Deploy TEST copy (test.morgana-yacht.pages.dev)
on:
  push:
    branches: [test]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0d05fe281c7244816fae3908aff78f8f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Write wrangler.toml with the boat-listings storage
        run: |
          ID=$(npx -y wrangler@3 kv namespace list | jq -r '.[] | select(.title|test("morgana-boats")) | .id' | head -1)
          test -n "$ID" || { echo "KV namespace not found"; exit 1; }
          printf 'name = "morgana-yacht"\npages_build_output_dir = "site"\ncompatibility_date = "2026-11-01"\n\n[[kv_namespaces]]\nbinding = "BOATS"\nid = "%s"\n' "$ID" > wrangler.toml
          cat wrangler.toml
      - name: Deploy to the test branch (preview URL, not the live domain)
        run: npx -y wrangler@3 pages deploy --branch=test --commit-dirty=true
